[project]
name = "pydantic-socketio"
version = "0.2.0"
description = "Pydantic validation and typed Python-to-TypeScript contracts for Socket.IO, with AsyncAPI export."
readme = "README.md"
authors = [
    { name = "Atomie CHEN", email = "atomic_cwh@163.com" }
]
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = ["pydantic", "socketio", "socket-io", "fastapi", "asyncapi", "typescript", "type-safety", "codegen", "realtime"]
dependencies = [
    "pydantic>=2.10.6",
    "python-socketio>=5.16.2",
    "typing_extensions>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/atomiechen/Pydantic-SocketIO"
Repository = "https://github.com/atomiechen/Pydantic-SocketIO"
Issues = "https://github.com/atomiechen/Pydantic-SocketIO/issues"
Changelog = "https://github.com/atomiechen/Pydantic-SocketIO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = [
    "fastapi[standard]>=0.115.11",
]
client = [
    "python-socketio[client]>=5.16.2",
]
asyncio-client = [
    "python-socketio[asyncio-client]>=5.16.2",
]
docs = [
    "python-socketio[docs]>=5.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/packages", "/examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_socketio"]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115.11",
    "gunicorn>=23.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.414",
    "python-socketio[client]>=5.16.2",
    "ruff>=0.11.0,<0.12.0",
]

[tool.pyright]
include = ["tests/typecheck_typed_contract.py"]
pythonVersion = "3.8"
