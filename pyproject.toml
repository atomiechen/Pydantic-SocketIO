[project]
name = "pydantic-socketio"
version = "0.2.0"
description = "Pydantic-enhanced SocketIO with FastAPI integration support."
readme = "README.md"
authors = [
    { name = "Atomie CHEN", email = "atomic_cwh@163.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["pydantic", "socketio", "fastapi"]
dependencies = [
    "pydantic>=2.10.6",
    "python-socketio>=5.16.2",
    "typing_extensions>=4.13.0",
]

[project.urls]
homepage = "https://github.com/atomiechen/Pydantic-SocketIO"
issues = "https://github.com/atomiechen/Pydantic-SocketIO/issues"
changelog = "https://github.com/atomiechen/Pydantic-SocketIO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = [
    "fastapi[standard]>=0.115.11",
]
client = [
    "python-socketio[client]>=5.16.2",
]
asyncio-client = [
    "python-socketio[asyncio-client]>=5.16.2",
]
docs = [
    "python-socketio[docs]>=5.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/packages"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_socketio"]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115.11",
    "gunicorn>=23.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.414",
    "python-socketio[client]>=5.16.2",
    "ruff>=0.11.0,<0.12.0",
]

[tool.pyright]
include = ["tests/typecheck_typed_contract.py"]
pythonVersion = "3.8"
