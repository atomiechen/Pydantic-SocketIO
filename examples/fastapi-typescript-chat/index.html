<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pydantic-SocketIO chat example</title>
  </head>
  <body>
    <main>
      <h1>Typed Socket.IO chat</h1>
      <p id="status">Connecting…</p>
      <form id="ask-form">
        <label for="message">Message</label>
        <input id="message" name="message" required autocomplete="off" />
        <button type="submit">Send</button>
      </form>
      <p id="ack" aria-live="polite"></p>
      <ul id="notices" aria-live="polite"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
